ai_behaviour: "Тактика ИИ"
ai_behaviour_DESC: "Слот тактики ИИ."

ai_behaviour_default: "Стандартное поведение"
ai_behaviour_default_DESC: "Использует тактическое поведение стандартных компьютеров. Для использования с ванильными боевыми компьютерами.\n\n§GКак использовать:§! §BВыберите это поведение, если хотите использовать ванильное поведение в слоте и НЕ использовать продвинутую тактику. Если вы хотите использовать продвинутую тактику для данного класса кораблей, выберите ванильный компьютер в слоте перед первым, а затем выберите тактику для этого слота.§!\n\n"

ai_behaviour_follow: "Тактика сопровождения"
ai_behaviour_follow_DESC: "Корабли будут следовать в фарватере остального флота. Сбалансированное стандартное поведение."

ai_behaviour_charge: "Тактика прорыва"
ai_behaviour_charge_DESC: "Корабли будут стараться приблизиться к противнику как можно ближе и атаковать его прямой наводкой."

