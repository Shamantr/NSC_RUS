l_russian:
 SHIP_GRAPHICS_STRIKECRUISER_DESC: "Тяжёлые крейсера предназначены для захвата и удержания сил противника, пока не прибудет подкрепление."
 SHIP_GRAPHICS_EXPLORATIONSHIP_DESC: "Боеспособный научный корабль, построенный с учётом потенциального противостояния враждебным силам, когда иного выхода не остаётся."
 SHIP_GRAPHICS_BATTLECRUISER_DESC: "Крупная и продвинутая версия крейсера, предназначенная для ведения боя в авангарде."
 SHIP_GRAPHICS_CARRIER_DESC: "Огромные боевые корабли, способные нести множество штурмовиков и истребителей. Поскольку ангары требуют слишком много пространства, они слабо защищены от ударных кораблей противника."
 SHIP_GRAPHICS_DREADNOUGHT_DESC: "Более крупная и продвинутая версия линкора, разработанная для ведения боя именно в авангарде флота любой империи."
 SHIP_GRAPHICS_FLAGSHIP_DESC: "Колоссальный флагманский корабль, в котором находится командование флота, обладающий невероятными наступательными возможностями. Гордость любого флота."